<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title description">
  <title id="title">DualSense Bluetooth Off</title>
  <desc id="description">A desktop shortcut for disconnecting a DualSense controller while keeping its pairing.</desc>
  <rect width="960" height="240" rx="24" fill="#111827"/>
  <circle cx="126" cy="120" r="77" fill="#1e293b"/>
  <path d="M83 98c-13 1-20 40-15 54 3 9 10 8 17 0l14-14h54l14 14c7 8 14 9 17 0 5-14-2-53-15-54-28-8-58-8-86 0z" fill="#f8fafc"/>
  <path d="M94 108v24m-12-12h24" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
  <circle cx="157" cy="112" r="4" fill="#38bdf8"/><circle cx="167" cy="123" r="4" fill="#38bdf8"/>
  <path d="M119 80a17 17 0 1 0 14 0m-7-8v20" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <text x="244" y="105" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="700">DualSense Bluetooth Off</text>
  <text x="246" y="151" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="24">One click to disconnect. Pairing stays saved.</text>
  <text x="246" y="190" fill="#38bdf8" font-family="Segoe UI,Arial,sans-serif" font-size="17">WINDOWS  ·  DESKTOP SHORTCUT  ·  POWERSHELL</text>
